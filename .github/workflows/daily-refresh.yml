name: Daily refresh & redeploy

# Preserve the production repository's existing deployment schedule.
# Reviews in the rebuild are owner-supplied static content, not a live API feed.
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch: {}

concurrency:
  group: cf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Regression checks
        run: npm run test:redirect && npm run test:motion
      - name: Build & deploy
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
